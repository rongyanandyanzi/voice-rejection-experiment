services:
  - type: web
    name: voice-rejection-constructiveness-v2-pilot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_EVALUATOR_MODEL
        value: gpt-5.5
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_TIMEOUT_MS
        value: "45000"
    disk:
      name: constructiveness-v2-pilot-data
      mountPath: /var/data
      sizeGB: 1
